<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0ca">
<meta property="og:title" content="Uçan Kuş — günlük meydan okuma">
<meta property="og:description" content="Herkese aynı borular. Bugünkü skoru yakalayabilir misin?">
<title>Uçan Kuş</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #14212b;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas#c { display: block; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  #ui { position: absolute; inset: 0; overflow: hidden; border-radius: 12px; pointer-events: none; }
  #uiInner { width: 480px; height: 720px; transform-origin: top left; position: absolute; top: 0; left: 0; }
  .layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .18s ease;
  }
  .layer.on { opacity: 1; visibility: visible; }
  .layer > * { pointer-events: none; }
  .mod-sec, .skin-satir, .panel { pointer-events: auto; }

  .baslik {
    font-size: 52px; font-weight: 800; letter-spacing: 1px; color: #fff5b0;
    text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 18px rgba(255,220,80,.35);
    margin-top: 92px;
  }
  .altbaslik { font-size: 17px; color: rgba(255,255,255,.9); text-shadow: 0 2px 4px rgba(0,0,0,.5); margin-top: 6px; }
  .mod-sec { display: flex; gap: 8px; margin-top: 16px; background: rgba(0,0,0,.28); padding: 5px; border-radius: 14px; }
  .mod-sec button {
    border: 0; background: transparent; color: rgba(255,255,255,.75);
    font: 700 15px "Segoe UI", system-ui, sans-serif; padding: 9px 20px; border-radius: 10px; cursor: pointer;
  }
  .mod-sec button.aktif { background: #ffd166; color: #4a3200; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .seri { margin-top: 10px; font-size: 15px; font-weight: 700; color: #ffd166;
          text-shadow: 0 2px 4px rgba(0,0,0,.5); min-height: 20px; }
  .skin-satir { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .skin-ok { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
             background: rgba(255,255,255,.22); color: #fff; font-size: 20px; font-weight: 700; }
  .skin-ok:active { transform: scale(.93); }
  .skin-kutu { width: 176px; text-align: center; }
  .skin-ad { font-size: 17px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .skin-durum { font-size: 13px; color: #ffd166; margin-top: 3px; height: 16px; }
  .ipucu { position: absolute; bottom: 126px; width: 100%; text-align: center; }
  .ipucu .buyuk { font-size: 27px; font-weight: 800; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4);
                  animation: nabiz 1.4s ease-in-out infinite; }
  .ipucu .kucuk { font-size: 15px; color: rgba(255,255,255,.85); margin-top: 6px; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  @keyframes nabiz { 0%,100% { opacity: .55; transform: scale(.98);} 50% { opacity: 1; transform: scale(1.03);} }

  .panel {
    width: 336px; margin-top: 120px; padding: 20px 20px 22px;
    background: rgba(16,30,40,.90); border: 2px solid rgba(255,255,255,.20);
    border-radius: 20px; text-align: center; color: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .panel h2 { font-size: 30px; color: #ff9a6b; letter-spacing: .5px; }
  .panel .modad { font-size: 12px; color: #9fc4d8; margin-top: 3px; letter-spacing: 1px; }
  .skorlar { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 14px; }
  .madalya { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center;
             justify-content: center; font-size: 12px; font-weight: 800; color: rgba(0,0,0,.62);
             box-shadow: inset 0 -4px 10px rgba(0,0,0,.25); flex: none; }
  .sayilar { text-align: left; }
  .sayilar .etiket { font-size: 11px; color: #a9c9db; letter-spacing: 1.5px; }
  .sayilar .deger { font-size: 36px; font-weight: 800; line-height: 1.05; }
  .sayilar .kucukdeger { font-size: 21px; font-weight: 800; line-height: 1.2; }
  .rozetler { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 12px; min-height: 22px; }
  .rozet { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
           background: rgba(255,255,255,.12); color: #dff0fa; }
  .rozet.vurgu { background: #ffd166; color: #4a3200; }
  .yeni-karakter { margin-top: 10px; font-size: 14px; font-weight: 800; color: #b7ff9e; min-height: 18px; }
  .dugmeler { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px 10px; cursor: pointer;
         font: 800 16px "Segoe UI", system-ui, sans-serif; box-shadow: 0 4px 0 rgba(0,0,0,.28); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
  .btn.birincil { background: #ffd166; color: #4a3200; }
  .btn.ikincil { background: #3fb8d8; color: #06262f; }

  #tost {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(14px);
    background: rgba(10,22,30,.94); color: #fff; font-size: 14px; font-weight: 600;
    padding: 11px 18px; border-radius: 12px; opacity: 0; transition: all .25s ease;
    pointer-events: none; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,.15);
  }
  #tost.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #kartKatman {
    position: absolute; inset: 0; background: rgba(6,14,20,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    opacity: 0; visibility: hidden; transition: opacity .2s ease; pointer-events: none;
  }
  #kartKatman.on { opacity: 1; visibility: visible; pointer-events: auto; }
  #kartKatman img { width: 300px; height: 300px; border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.6); }
  #kartKatman p { color: #cfe6f3; font-size: 13px; text-align: center; max-width: 330px; line-height: 1.5; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="ui"><div id="uiInner">

      <div class="layer" id="katmanHazir">
        <div class="baslik">UÇAN KUŞ</div>
        <div class="altbaslik" id="hazirRekor">Rekor: 0</div>
        <div class="mod-sec">
          <button id="modGunluk" class="aktif">GÜNLÜK</button>
          <button id="modSonsuz">SONSUZ</button>
        </div>
        <div class="seri" id="seriYazi"></div>
        <div class="skin-satir">
          <button class="skin-ok" id="skinGeri">&lsaquo;</button>
          <div class="skin-kutu">
            <canvas id="skinOnizleme" width="220" height="84" style="width:110px;height:42px"></canvas>
            <div class="skin-ad" id="skinAd">Sarı Kuş</div>
            <div class="skin-durum" id="skinDurum"></div>
          </div>
          <button class="skin-ok" id="skinIleri">&rsaquo;</button>
        </div>
        <div class="ipucu">
          <div class="buyuk">BOŞLUK · DOKUN</div>
          <div class="kucuk">kanat çırpmak için</div>
        </div>
      </div>

      <div class="layer" id="katmanBitti">
        <div class="panel">
          <h2>OYUN BİTTİ</h2>
          <div class="modad" id="bittiMod">GÜNLÜK MEYDAN OKUMA</div>
          <div class="skorlar">
            <div class="madalya" id="madalya" style="display:none"></div>
            <div class="sayilar">
              <div class="etiket">SKOR</div>
              <div class="deger" id="bittiSkor">0</div>
              <div class="etiket" style="margin-top:6px">REKOR</div>
              <div class="kucukdeger" id="bittiRekor">0</div>
            </div>
          </div>
          <div class="rozetler" id="rozetler"></div>
          <div class="yeni-karakter" id="yeniKarakter"></div>
          <div class="dugmeler">
            <button class="btn birincil" id="btnTekrar">TEKRAR</button>
            <button class="btn ikincil" id="btnPaylas">PAYLAŞ</button>
          </div>
        </div>
      </div>

      <div id="kartKatman">
        <img id="kartGorsel" alt="skor kartı">
        <p>Kartı kaydetmek için üzerine uzun bas / sağ tıkla &rarr; <b>Resmi farklı kaydet</b></p>
        <button class="btn birincil" id="kartKapat" style="width:170px;flex:none">KAPAT</button>
      </div>

      <div id="tost"></div>
    </div></div>
  </div>
</div>
<script>
(() => {
"use strict";

const BASE_W = 480, BASE_H = 720;
const GROUND_Y = BASE_H - 96;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const uiInner = document.getElementById("uiInner");
const $ = (id) => document.getElementById(id);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = BASE_W * dpr; cv.height = BASE_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
  const gh = window.innerHeight || document.documentElement.clientHeight || BASE_H;
  const s = Math.max(0.25, Math.min(gw / BASE_W, gh / BASE_H) * 0.98);
  cv.style.width = (BASE_W * s) + "px";
  cv.style.height = (BASE_H * s) + "px";
  uiInner.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", resize);
resize();

// ------------------------------------------------------------ kayit
const KAYIT = {
  oku(k, varsayilan) {
    try { const v = localStorage.getItem("uk_" + k); return v === null ? varsayilan : JSON.parse(v); }
    catch (e) { return varsayilan; }
  },
  yaz(k, v) { try { localStorage.setItem("uk_" + k, JSON.stringify(v)); } catch (e) {} }
};

const bugun = () => {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
};
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const tarihYazi = (g) => {
  const gun = g % 100, ay = Math.floor(g / 100) % 100;
  return gun + " " + AY[ay - 1];
};

// tohumlu rastgele sayi (mulberry32) — ayni tohum, ayni borular
function tohumluRng(tohum) {
  let a = tohum >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------ karakterler
const SKINLER = [
  { id:"sari",    ad:"Sarı Kuş",    sart:0,  govde:"#f7d746", govde2:"#f0b429", kanat:"#fffdf0", gaga:"#f2811d" },
  { id:"ates",    ad:"Ateş Kuşu",   sart:10, govde:"#ff7a4d", govde2:"#e0361a", kanat:"#ffe0d0", gaga:"#ffc107" },
  { id:"gok",     ad:"Gök Kuşu",    sart:20, govde:"#5ec8f5", govde2:"#1d84c8", kanat:"#e6f8ff", gaga:"#ff9800" },
  { id:"papagan", ad:"Papağan",     sart:30, govde:"#84e05c", govde2:"#3d9a28", kanat:"#f2ffe8", gaga:"#ff5252" },
  { id:"gece",    ad:"Gece Kuşu",   sart:45, govde:"#a98ae8", govde2:"#6a49c4", kanat:"#efe8ff", gaga:"#ffd166" },
  { id:"altin",   ad:"Altın Kuş",   sart:60, govde:"#ffe27a", govde2:"#e0a000", kanat:"#fffdf0", gaga:"#ff7043", parlak:true }
];
const enIyiTum = () => Math.max(KAYIT.oku("rekor_sonsuz", 0), KAYIT.oku("rekor_gunluk_en", 0));
const skinAcik = (s) => s.sart <= enIyiTum();

let skinIndex = Math.max(0, SKINLER.findIndex(s => s.id === KAYIT.oku("skin", "sari")));
let mod = KAYIT.oku("mod", "gunluk");

// ------------------------------------------------------------ ses
let actx = null, sessiz = KAYIT.oku("sessiz", false);
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function ton(f0, f1, sure, tip, ses) {
  if (sessiz) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = tip; o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), a.currentTime + sure);
  g.gain.setValueAtTime(ses, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + sure);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + sure + 0.02);
}
const sCirp  = () => ton(520, 300, 0.10, "square", 0.055);
const sSkor  = () => ton(880, 1320, 0.12, "triangle", 0.085);
const sKil   = (k) => ton(700 + k * 130, 1500 + k * 200, 0.16, "sine", 0.10);
const sCarp  = () => ton(220, 60, 0.28, "sawtooth", 0.11);
const sDus   = () => ton(160, 40, 0.45, "sine", 0.08);
const sAcil  = () => { ton(660, 990, 0.14, "triangle", 0.09); setTimeout(() => ton(990, 1320, 0.22, "triangle", 0.09), 130); };

// ------------------------------------------------------------ oyun durumu
const HAZIR = 0, OYUN = 1, DUSUS = 2, BITTI = 3;
let durum = HAZIR;

const YERCEKIMI = 0.46, CIRPMA = -8.1, BORU_W = 70, BORU_ARA = 280;
const KIL_PAYI = 20;            // bu kadar yakindan gecmek "kil payi" sayilir

let kus, borular, skor, gecilen, ticks, dogumTick, sarsinti, flas, tuyler,
    bittiTick, rng, komboSayac, enUzunKombo, kilPayiSayisi, yavas, popuplar,
    hayaletKayit, hayaletVeri, hayaletIndex, yeniAcilanSkin, oyunTohumu, dogumSayaci;

function hizFor(i) { return Math.min(4.4, 2.6 + i * 0.035); }
function bosluFor(i) { return Math.max(132, 178 - i * 2.2); }

function rekorAnahtar() { return mod === "gunluk" ? "rekor_gunluk_" + bugun() : "rekor_sonsuz"; }
function hayaletAnahtar() { return mod === "gunluk" ? "hayalet_gunluk_" + bugun() : "hayalet_sonsuz"; }
function rekor() { return KAYIT.oku(rekorAnahtar(), 0); }

function sifirla() {
  kus = { x: 120, y: BASE_H * 0.42, v: 0, rot: 0, kanat: 0 };
  borular = []; skor = 0; gecilen = 0; ticks = 0; dogumTick = 0; dogumSayaci = 0;
  sarsinti = 0; flas = 0; tuyler = []; popuplar = [];
  komboSayac = 0; enUzunKombo = 0; kilPayiSayisi = 0; yavas = 0;
  yeniAcilanSkin = null;
  oyunTohumu = mod === "gunluk" ? bugun() : (Math.random() * 1e9) | 0;
  rng = tohumluRng(oyunTohumu);
  hayaletKayit = [];
  hayaletVeri = KAYIT.oku(hayaletAnahtar(), null);
  hayaletIndex = 0;
  durum = HAZIR;
  katmanGoster("hazir");
}

function basla() {
  skinDogrula();                       // kilitli karakterle oyuna baslanamaz
  durum = OYUN; dogumTick = ticks + 24; katmanGoster(null); cirp();
}

function cirp() { kus.v = CIRPMA; kus.kanat = 0; sCirp(); }

function ol() {
  durum = DUSUS;
  kus.v = Math.min(kus.v, -3.4);
  sarsinti = 14; flas = 0.85; sCarp();
  for (let i = 0; i < 16; i++) {
    tuyler.push({ x: kus.x, y: kus.y, vx: (Math.random() - .5) * 7, vy: -Math.random() * 5 - 1,
                  r: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .4,
                  s: 3 + Math.random() * 4, omur: 60 + Math.random() * 30 });
  }
}

function bittiEkrani() {
  durum = BITTI; bittiTick = ticks; sDus();
  const eskiRekorTum = enIyiTum();
  if (skor > rekor()) {
    KAYIT.yaz(rekorAnahtar(), skor);
    if (mod === "gunluk") KAYIT.yaz("rekor_gunluk_en", Math.max(KAYIT.oku("rekor_gunluk_en", 0), skor));
    if (hayaletKayit.length > 4) KAYIT.yaz(hayaletAnahtar(), hayaletKayit);
  }
  if (mod === "gunluk") seriGuncelle();
  const acilan = SKINLER.filter(s => s.sart > eskiRekorTum && s.sart <= enIyiTum());
  if (acilan.length) { yeniAcilanSkin = acilan[acilan.length - 1]; sAcil(); }
  bittiPaneliDoldur();
  katmanGoster("bitti");
}

function seriGuncelle() {
  const son = KAYIT.oku("seri_son_gun", 0);
  const g = bugun();
  if (son === g) return;
  const d = new Date(); d.setDate(d.getDate() - 1);
  const dun = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  KAYIT.yaz("seri", son === dun ? KAYIT.oku("seri", 0) + 1 : 1);
  KAYIT.yaz("seri_son_gun", g);
}

// ------------------------------------------------------------ girdi
function bas() {
  audio();
  if (durum === HAZIR) basla();
  else if (durum === OYUN) cirp();
  else if (durum === BITTI && ticks - bittiTick > 24) { sifirla(); basla(); }
}
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); bas(); });
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault(); if (!e.repeat) bas();
  } else if (e.code === "KeyR") { if (durum !== HAZIR) { sifirla(); basla(); } }
  else if (e.code === "KeyM") { sessiz = !sessiz; KAYIT.yaz("sessiz", sessiz); }
});

// ------------------------------------------------------------ guncelle
function daireDikdortgen(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function popup(yazi, x, y, renk, buyuk) {
  popuplar.push({ yazi, x, y, renk, buyuk: buyuk || false, omur: 52 });
}

function guncelle() {
  ticks++;
  if (sarsinti > 0) sarsinti *= 0.86;
  if (flas > 0) flas -= 0.06;
  if (yavas > 0) yavas--;
  for (const p of popuplar) { p.y -= 0.9; p.omur--; }
  popuplar = popuplar.filter(p => p.omur > 0);

  if (durum === HAZIR) {
    kus.y = BASE_H * 0.42 + Math.sin(ticks / 16) * 9;
    kus.rot = Math.sin(ticks / 16) * 0.12;
    kus.kanat = (kus.kanat + 0.22) % 3;
    return;
  }

  kus.v = Math.min(kus.v + YERCEKIMI, 13);
  kus.y += kus.v;
  kus.kanat = durum === OYUN ? (kus.kanat + (kus.v < 0 ? 0.42 : 0.14)) % 3 : 0;
  const hedef = kus.v < 0 ? -0.42 : Math.min(1.55, kus.v * 0.10);
  kus.rot += (hedef - kus.rot) * 0.18;

  for (const f of tuyler) { f.vy += 0.22; f.x += f.vx; f.y += f.vy; f.r += f.vr; f.omur--; }
  tuyler = tuyler.filter(f => f.omur > 0 && f.y < BASE_H);

  if (durum === DUSUS) {
    if (kus.y + 12 >= GROUND_Y) { kus.y = GROUND_Y - 12; kus.rot = 1.55; bittiEkrani(); }
    return;
  }
  if (durum === BITTI) return;

  // ---- OYUN
  if (ticks % 2 === 0) hayaletKayit.push(Math.round(kus.y));
  hayaletIndex = Math.floor(ticks / 2);


  if (ticks >= dogumTick) {
    const sira = dogumSayaci++;
    const bosluk = bosluFor(sira);
    const kenar = 70;
    const gy = kenar + bosluk / 2 + rng() * (GROUND_Y - bosluk - kenar * 2);
    borular.push({ x: BASE_W + 20, gy, bosluk, i: sira, sayildi: false });
    dogumTick = ticks + Math.round(BORU_ARA / hizFor(sira));
  }

  for (const p of borular) {
    p.x -= hizFor(p.i);
    if (!p.sayildi && p.x + BORU_W < kus.x) {
      p.sayildi = true; gecilen++;
      const ustBosluk = kus.y - (p.gy - p.bosluk / 2) - 12;
      const altBosluk = (p.gy + p.bosluk / 2) - kus.y - 12;
      const aciklik = Math.min(ustBosluk, altBosluk);
      if (aciklik < KIL_PAYI) {
        komboSayac++;
        kilPayiSayisi++;
        enUzunKombo = Math.max(enUzunKombo, komboSayac);
        const bonus = 2 * komboSayac;
        skor += 1 + bonus;
        yavas = 22;
        sKil(Math.min(komboSayac, 5));
        popup("KIL PAYI x" + komboSayac + "  +" + (1 + bonus), kus.x + 40, kus.y - 26, "#ffd166", true);
      } else {
        komboSayac = 0;
        skor += 1;
        sSkor();
      }
    }
  }
  borular = borular.filter(p => p.x + BORU_W > -10);

  if (kus.y + 12 >= GROUND_Y) { kus.y = GROUND_Y - 12; ol(); bittiEkrani(); return; }
  if (kus.y < 10) { kus.y = 10; kus.v = Math.max(kus.v, -1); }

  for (const p of borular) {
    const ustH = p.gy - p.bosluk / 2, altY = p.gy + p.bosluk / 2;
    if (daireDikdortgen(kus.x, kus.y, 12, p.x, -100, BORU_W, ustH + 100) ||
        daireDikdortgen(kus.x, kus.y, 12, p.x, altY, BORU_W, GROUND_Y - altY)) { ol(); return; }
  }
}

// ------------------------------------------------------------ cizim
const bulutlar = Array.from({ length: 6 }, () => ({
  x: Math.random() * BASE_W, y: 60 + Math.random() * 170,
  s: 0.6 + Math.random() * 0.8, sp: 0.18 + Math.random() * 0.22
}));

function yuvarlakDik(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function gokyuzu(g2) {
  const c = g2 || ctx;
  const g = c.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, "#4ec0ca"); g.addColorStop(0.65, "#7fd6d8"); g.addColorStop(1, "#bfe9c8");
  c.fillStyle = g; c.fillRect(0, 0, BASE_W, GROUND_Y);
  c.fillStyle = "rgba(255,246,200,.85)";
  c.beginPath(); c.arc(390, 96, 40, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(255,255,255,.35)";
  c.beginPath(); c.arc(390, 96, 60, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(255,255,255,.78)";
  for (const b of bulutlar) {
    if (durum === OYUN || durum === DUSUS) b.x -= b.sp;
    if (b.x < -90 * b.s) { b.x = BASE_W + 60; b.y = 60 + Math.random() * 170; }
    const s = b.s;
    c.beginPath();
    c.arc(b.x, b.y, 20 * s, 0, Math.PI * 2);
    c.arc(b.x + 22 * s, b.y - 10 * s, 26 * s, 0, Math.PI * 2);
    c.arc(b.x + 48 * s, b.y, 19 * s, 0, Math.PI * 2);
    c.fill();
  }
  const off = (ticks * 0.35) % 160;
  c.fillStyle = "#5aa86a";
  c.beginPath(); c.moveTo(-160, GROUND_Y);
  for (let x = -160; x <= BASE_W + 160; x += 160) {
    c.quadraticCurveTo(x + 40 - off, GROUND_Y - 74, x + 80 - off, GROUND_Y - 6);
    c.quadraticCurveTo(x + 120 - off, GROUND_Y - 52, x + 160 - off, GROUND_Y - 4);
  }
  c.lineTo(BASE_W + 160, GROUND_Y); c.closePath(); c.fill();
  c.fillStyle = "#3f8c50";
  const off2 = (ticks * 0.8) % 60;
  for (let x = -60; x <= BASE_W + 60; x += 60) {
    c.beginPath(); c.arc(x - off2 + 30, GROUND_Y + 2, 22, Math.PI, 0); c.fill();
  }
}

function zemin() {
  ctx.fillStyle = "#3c7f3c"; ctx.fillRect(0, GROUND_Y, BASE_W, 12);
  ctx.fillStyle = "#ded895"; ctx.fillRect(0, GROUND_Y + 12, BASE_W, BASE_H - GROUND_Y - 12);
  ctx.fillStyle = "#d3cc84";
  const off = (ticks * hizFor(gecilen)) % 48;
  for (let x = -48; x < BASE_W + 48; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x - off, GROUND_Y + 12); ctx.lineTo(x - off + 24, GROUND_Y + 12);
    ctx.lineTo(x - off + 10, BASE_H); ctx.lineTo(x - off - 14, BASE_H);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "rgba(0,0,0,.10)"; ctx.fillRect(0, GROUND_Y + 12, BASE_W, 5);
}

function boruCiz(p) {
  const ustH = p.gy - p.bosluk / 2, altY = p.gy + p.bosluk / 2;
  const g = ctx.createLinearGradient(p.x, 0, p.x + BORU_W, 0);
  g.addColorStop(0, "#4f9c2b"); g.addColorStop(0.28, "#8ed64a");
  g.addColorStop(0.62, "#5fb033"); g.addColorStop(1, "#356b1c");
  const baslik = (y) => {
    ctx.fillStyle = g; yuvarlakDik(p.x - 5, y, BORU_W + 10, 28, 5); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 2;
    yuvarlakDik(p.x - 5, y, BORU_W + 10, 28, 5); ctx.stroke();
  };
  ctx.fillStyle = g;
  ctx.fillRect(p.x, 0, BORU_W, ustH - 26);
  ctx.fillRect(p.x, altY + 26, BORU_W, GROUND_Y - altY - 26);
  ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 2;
  ctx.strokeRect(p.x + 1, -2, BORU_W - 2, ustH - 24);
  ctx.strokeRect(p.x + 1, altY + 26, BORU_W - 2, GROUND_Y - altY - 24);
  baslik(ustH - 28); baslik(altY);
}

function kusCiz(c, x, y, rot, kanat, skin, saydam) {
  c.save(); c.translate(x, y); c.rotate(rot);
  if (saydam) c.globalAlpha = 0.34;
  if (skin.parlak && !saydam) { c.shadowColor = "rgba(255,215,80,.9)"; c.shadowBlur = 16; }
  c.fillStyle = skin.govde;
  c.beginPath(); c.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;
  c.fillStyle = skin.govde2;
  c.beginPath(); c.ellipse(-2, 5, 14, 8, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(60,40,0,.42)"; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); c.stroke();
  const kp = Math.floor(kanat) % 3;
  const wy = kp === 1 ? -7 : (kp === 2 ? 6 : 0);
  c.fillStyle = skin.kanat;
  c.beginPath(); c.ellipse(-3, wy + 1, 10, 6.5, wy * 0.05, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(60,40,0,.32)"; c.lineWidth = 1.2;
  c.beginPath(); c.ellipse(-3, wy + 1, 10, 6.5, wy * 0.05, 0, Math.PI * 2); c.stroke();
  c.fillStyle = "#fff";
  c.beginPath(); c.arc(8, -4, 5.5, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(60,40,0,.42)"; c.lineWidth = 1.2;
  c.beginPath(); c.arc(8, -4, 5.5, 0, Math.PI * 2); c.stroke();
  c.fillStyle = "#222";
  c.beginPath(); c.arc(9.6, -4, 2.4, 0, Math.PI * 2); c.fill();
  c.fillStyle = skin.gaga;
  c.beginPath(); c.moveTo(14, -1); c.lineTo(26, 1.5); c.lineTo(14, 6); c.closePath(); c.fill();
  c.strokeStyle = "rgba(120,60,0,.42)"; c.stroke();
  c.restore();
}

function metin(txt, x, y, boy, dolgu, hiza) {
  ctx.font = "800 " + boy + "px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = hiza || "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(4, boy / 8); ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineJoin = "round";
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = dolgu || "#fff"; ctx.fillText(txt, x, y);
}

function ciz() {
  ctx.save();
  if (sarsinti > 0.4) ctx.translate((Math.random() - .5) * sarsinti, (Math.random() - .5) * sarsinti);

  gokyuzu();
  for (const p of borular) boruCiz(p);
  zemin();

  // hayalet: rekor kosunun yari saydam kopyasi
  if (hayaletVeri && durum === OYUN && hayaletIndex < hayaletVeri.length) {
    const hy = hayaletVeri[hayaletIndex];
    const onceki = hayaletVeri[Math.max(0, hayaletIndex - 1)];
    kusCiz(ctx, kus.x, hy, Math.max(-0.4, Math.min(1.4, (hy - onceki) * 0.10)),
           1, SKINLER[skinIndex], true);
  }

  ctx.fillStyle = "#fdf3b0";
  for (const f of tuyler) {
    ctx.save(); ctx.globalAlpha = Math.min(1, f.omur / 40);
    ctx.translate(f.x, f.y); ctx.rotate(f.r);
    ctx.beginPath(); ctx.ellipse(0, 0, f.s, f.s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  kusCiz(ctx, kus.x, kus.y, kus.rot, kus.kanat, SKINLER[skinIndex], false);
  ctx.restore();

  if (flas > 0) { ctx.fillStyle = "rgba(255,255,255," + Math.max(0, flas) + ")"; ctx.fillRect(0, 0, BASE_W, BASE_H); }

  if (durum === OYUN || durum === DUSUS) {
    metin(String(skor), BASE_W / 2, 92, 62);
    if (komboSayac > 0) metin("KOMBO x" + komboSayac, BASE_W / 2, 138, 22, "#ffd166");
    if (mod === "gunluk") metin(tarihYazi(bugun()).toUpperCase() + " MEYDAN OKUMASI", BASE_W / 2, 30, 14, "#eaffff");
  }

  for (const p of popuplar) {
    ctx.save(); ctx.globalAlpha = Math.min(1, p.omur / 30);
    metin(p.yazi, p.x, p.y, p.buyuk ? 20 : 16, p.renk);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------ arayuz
function katmanGoster(ad) {
  $("katmanHazir").classList.toggle("on", ad === "hazir");
  $("katmanBitti").classList.toggle("on", ad === "bitti");
  if (ad === "hazir") hazirPaneliDoldur();
}

let tostZaman = 0;
function tost(yazi) {
  const t = $("tost"); t.textContent = yazi; t.classList.add("on");
  clearTimeout(tostZaman);
  tostZaman = setTimeout(() => t.classList.remove("on"), 2600);
}

function madalyaFor(s) {
  if (s >= 40) return { r1: "#b9f2ff", r2: "#6fd7ef", ad: "PLATİN" };
  if (s >= 25) return { r1: "#ffe37a", r2: "#e0a92b", ad: "ALTIN" };
  if (s >= 12) return { r1: "#e6e9ee", r2: "#a3adba", ad: "GÜMÜŞ" };
  if (s >= 5)  return { r1: "#f0b98a", r2: "#b4713c", ad: "BRONZ" };
  return null;
}

function skinOnizlemeCiz() {
  const oc = $("skinOnizleme"), o = oc.getContext("2d");
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.clearRect(0, 0, oc.width, oc.height);
  o.setTransform(2, 0, 0, 2, 0, 0);
  const s = SKINLER[skinIndex];
  if (skinAcik(s)) {
    kusCiz(o, 55, 21, 0, (Date.now() / 160) % 3, s, false);
  } else {
    o.globalAlpha = 0.35;
    kusCiz(o, 55, 21, 0, 0, s, false);
    o.globalAlpha = 1;
    o.font = "800 22px 'Segoe UI', sans-serif"; o.textAlign = "center"; o.textBaseline = "middle";
    o.fillText("🔒", 55, 21);
  }
}

function hazirPaneliDoldur() {
  $("hazirRekor").textContent = (mod === "gunluk" ? "Bugünkü rekorun: " : "Rekor: ") + rekor();
  $("modGunluk").classList.toggle("aktif", mod === "gunluk");
  $("modSonsuz").classList.toggle("aktif", mod === "sonsuz");
  const seri = KAYIT.oku("seri", 0);
  $("seriYazi").textContent = (mod === "gunluk" && seri > 0) ? ("🔥 " + seri + " günlük seri") : "";
  const s = SKINLER[skinIndex];
  $("skinAd").textContent = s.ad;
  $("skinDurum").textContent = skinAcik(s) ? (skinIndex === 0 ? "başlangıç kuşu" : "açıldı ✓")
                                           : (s.sart + " rekor gerekiyor");
  skinOnizlemeCiz();
}

function bittiPaneliDoldur() {
  $("bittiMod").textContent = mod === "gunluk"
    ? (tarihYazi(bugun()).toUpperCase() + " MEYDAN OKUMASI") : "SONSUZ MOD";
  $("bittiSkor").textContent = skor;
  $("bittiRekor").textContent = rekor();
  const m = madalyaFor(skor), el = $("madalya");
  if (m) {
    el.style.display = "flex";
    el.style.background = "radial-gradient(circle at 34% 30%, " + m.r1 + ", " + m.r2 + ")";
    el.textContent = m.ad;
  } else el.style.display = "none";

  const r = $("rozetler"); r.innerHTML = "";
  const ekle = (yazi, vurgu) => {
    const d = document.createElement("div");
    d.className = "rozet" + (vurgu ? " vurgu" : ""); d.textContent = yazi; r.appendChild(d);
  };
  if (skor > 0 && skor >= rekor()) ekle("YENİ REKOR", true);
  if (enUzunKombo > 0) ekle("en uzun kombo x" + enUzunKombo);
  if (kilPayiSayisi > 0) ekle(kilPayiSayisi + " kıl payı");
  const seri = KAYIT.oku("seri", 0);
  if (mod === "gunluk" && seri > 1) ekle("🔥 " + seri + " gün");
  $("yeniKarakter").textContent = yeniAcilanSkin ? ("🎉 YENİ KARAKTER: " + yeniAcilanSkin.ad) : "";
}

// ------------------------------------------------------------ paylasim
const OYUN_LINK = "https://dali123123123.github.io/ucan-kus/";

function paylasimMetni() {
  const m = madalyaFor(skor);
  const bas = mod === "gunluk"
    ? ("Uçan Kuş · " + tarihYazi(bugun()) + " günlük meydan okuması")
    : "Uçan Kuş · sonsuz mod";
  let s = bas + "\nSkor: " + skor + (m ? " " + m.ad : "");
  if (enUzunKombo > 1) s += " · en uzun kombo x" + enUzunKombo;
  s += mod === "gunluk" ? "\nBugün herkese aynı borular çıkıyor, sen geç bakalım:\n" : "\nSen de dene:\n";
  return s + OYUN_LINK;
}

function kartCiz() {
  const k = document.createElement("canvas");
  k.width = 640; k.height = 640;
  const c = k.getContext("2d");
  const g = c.createLinearGradient(0, 0, 0, 640);
  g.addColorStop(0, "#4ec0ca"); g.addColorStop(0.62, "#7fd6d8"); g.addColorStop(1, "#bfe9c8");
  c.fillStyle = g; c.fillRect(0, 0, 640, 640);
  c.fillStyle = "rgba(255,246,200,.85)"; c.beginPath(); c.arc(540, 96, 44, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(255,255,255,.75)";
  for (const b of [[110, 130, 1.1], [430, 220, .8], [180, 300, .6]]) {
    c.beginPath();
    c.arc(b[0], b[1], 22 * b[2], 0, Math.PI * 2);
    c.arc(b[0] + 24 * b[2], b[1] - 11 * b[2], 28 * b[2], 0, Math.PI * 2);
    c.arc(b[0] + 52 * b[2], b[1], 21 * b[2], 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = "#3c7f3c"; c.fillRect(0, 556, 640, 14);
  c.fillStyle = "#ded895"; c.fillRect(0, 570, 640, 70);
  return { k, c };
}

function skorKarti() {
  const { k, c } = kartCiz();
  const yaz = (t, x, y, boy, dolgu, kalinlik) => {
    c.font = "800 " + boy + "px 'Segoe UI', system-ui, sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.lineWidth = kalinlik || Math.max(5, boy / 7);
    c.strokeStyle = "rgba(0,0,0,.5)"; c.lineJoin = "round";
    c.strokeText(t, x, y); c.fillStyle = dolgu; c.fillText(t, x, y);
  };
  yaz("UÇAN KUŞ", 320, 84, 52, "#fff5b0");
  yaz(mod === "gunluk" ? (tarihYazi(bugun()) + " meydan okuması") : "sonsuz mod", 320, 132, 24, "#eaffff");

  c.save(); c.translate(320, 250); c.scale(3.1, 3.1);
  kusCiz(c, 0, 0, -0.18, 1, SKINLER[skinIndex], false);
  c.restore();

  yaz(String(skor), 320, 400, 132, "#ffffff", 12);
  const m = madalyaFor(skor);
  if (m) {
    const gr = c.createRadialGradient(316, 484, 4, 320, 490, 46);
    gr.addColorStop(0, m.r1); gr.addColorStop(1, m.r2);
    c.fillStyle = gr; c.beginPath(); c.arc(320, 490, 46, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = 3; c.stroke();
    yaz(m.ad, 320, 490, 17, "rgba(0,0,0,.6)", 0.1);
  }
  const alt = [];
  if (enUzunKombo > 1) alt.push("kombo x" + enUzunKombo);
  if (kilPayiSayisi > 0) alt.push(kilPayiSayisi + " kıl payı");
  if (alt.length) yaz(alt.join("  ·  "), 320, m ? 556 : 500, 22, "#fff8d0");
  yaz("dali123123123.github.io/ucan-kus", 320, 612, 21, "#2c4a3a", 4);
  return k;
}

async function panoyaKopyala(metin) {
  try { await navigator.clipboard.writeText(metin); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = metin; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

async function paylas() {
  const kart = skorKarti();
  const metin = paylasimMetni();
  const blob = await new Promise(res => kart.toBlob(res, "image/png"));
  const dosya = blob ? new File([blob], "ucan-kus-skor.png", { type: "image/png" }) : null;

  if (dosya && navigator.canShare && navigator.canShare({ files: [dosya] })) {
    try { await navigator.share({ files: [dosya], text: metin }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: "Uçan Kuş", text: metin }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const kopyalandi = await panoyaKopyala(metin);
  $("kartGorsel").src = kart.toDataURL("image/png");
  $("kartKatman").classList.add("on");
  tost(kopyalandi ? "Meydan okuma metni panoya kopyalandı 📋" : "Kartı kaydedip paylaşabilirsin");
}

// ------------------------------------------------------------ dugmeler
function dugme(id, isle) {
  const el = $(id);
  el.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
  el.addEventListener("click", (e) => { e.stopPropagation(); audio(); isle(); });
}
dugme("modGunluk", () => { mod = "gunluk"; KAYIT.yaz("mod", mod); sifirla(); });
dugme("modSonsuz", () => { mod = "sonsuz"; KAYIT.yaz("mod", mod); sifirla(); });
dugme("skinGeri", () => { skinIndex = (skinIndex + SKINLER.length - 1) % SKINLER.length; skinSec(); });
dugme("skinIleri", () => { skinIndex = (skinIndex + 1) % SKINLER.length; skinSec(); });
dugme("btnTekrar", () => { sifirla(); basla(); });
dugme("btnPaylas", () => { paylas(); });
dugme("kartKapat", () => { $("kartKatman").classList.remove("on"); });

function skinSec() {
  const s = SKINLER[skinIndex];
  if (skinAcik(s)) KAYIT.yaz("skin", s.id);
  else tost(s.ad + " için " + s.sart + " rekor gerekiyor");
  hazirPaneliDoldur();
}

// kilitli skin secilirse acik olana geri don
function skinDogrula() {
  if (!skinAcik(SKINLER[skinIndex])) {
    const acikOlan = SKINLER.map((s, i) => [s, i]).filter(([s]) => skinAcik(s));
    skinIndex = acikOlan.length ? acikOlan[acikOlan.length - 1][1] : 0;
  }
}

// ------------------------------------------------------------ dongu
const ADIM = 1000 / 60;
let son = performance.now(), birikim = 0;

function kare(t) {
  const olcek = yavas > 0 ? 0.32 : 1;
  birikim += Math.min(t - son, 250) * olcek;
  son = t;
  while (birikim >= ADIM) { guncelle(); birikim -= ADIM; }
  ciz();
  if (durum === HAZIR && ticks % 10 === 0) skinOnizlemeCiz();
  requestAnimationFrame(kare);
}

skinDogrula();
sifirla();
requestAnimationFrame(kare);
try { window.focus(); } catch (e) {}
})();
</script>
